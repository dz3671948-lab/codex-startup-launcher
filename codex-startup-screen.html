<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex · 启动动画</title><link rel="stylesheet" href="startup.css"><script src="startup.js" defer></script></head>
<body>
<canvas id="stars" aria-hidden="true"></canvas><div class="atmosphere" aria-hidden="true"></div>
<div class="screen">
<header><div class="brand">CODEX<span>STARTUP EXPERIENCE</span></div><nav aria-label="页面控制"><button id="sound" aria-pressed="true">声音：开</button><button id="settings">设置</button></nav></header>
<main>
<div class="eyebrow"><span></span><span id="stage">01 / 06</span> · STARTUP SEQUENCE</div>
<div class="emblem"><div class="orbit" aria-hidden="true"></div><img id="logo" src="codex-icon.svg" alt="OpenAI Blossom 标志" width="220" height="220"></div>
<section aria-live="polite" aria-atomic="true"><p id="english" class="english">READY TO BEGIN</p><h1 id="title">准备好，开始创造</h1><p id="description" class="description">确认你的显示名称，开启这段启动体验。</p></section>
<div class="identity"><span>OPERATOR</span><strong id="identity">CODEX OPERATOR</strong><span class="dot"></span></div>
<div class="progress" role="progressbar" aria-label="启动动画进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bar"></div></div>
<div class="actions"><button id="action" class="primary">开始体验 <span>↵</span></button><button id="skip">跳过 <span>Esc</span></button></div>
<p class="hint" id="hint">点击或按 Enter 开始 · 首次操作后播放声音</p>
</main>
<footer><span id="status">等待开始</span><span>本地启动动画 · 非官方作品</span></footer>
</div>
<dialog id="panel"><form id="config"><div class="dialog-heading"><h2>启动动画设置</h2><button type="button" id="close" aria-label="关闭设置">×</button></div><label>显示名称<input id="name" maxlength="32" autocomplete="off" value="CODEX OPERATOR"></label><label>外观<select id="theme"><option value="dark">深空 · 深色</option><option value="light">晨光 · 暖白</option></select></label><label class="check"><input id="effects" type="checkbox" checked> 启动与界面音效</label><label class="check"><input id="voice" type="checkbox"> 系统中文语音播报</label><p class="note">语音使用系统音色；本页不执行账号验证或权限授权。</p><button type="submit" class="primary">保存设置</button></form></dialog>
</body></html>
